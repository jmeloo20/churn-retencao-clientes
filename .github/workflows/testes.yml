name: Testes e reproducao
on: [push, pull_request]
jobs:
  verificar:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python analise.py
      - run: python gerar_painel.py
      - run: python auditar_sql.py
      - run: python prever.py exemplo_entrada.csv /tmp/previsoes.csv
      - uses: actions/upload-artifact@v4
        with:
          name: resultados-verificados
          path: |
            resultados/
            !resultados/modelo.joblib
